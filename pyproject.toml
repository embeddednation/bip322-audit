[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-audit"
version = "0.5.0"
description = "Proof of control of a wallet's coins at a block: BIP-322 proofs per funded address plus the on-chain checks an auditor runs on their own node"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "bip322-core>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bip322-audit = "bip322audit.cli:main"

[tool.setuptools.packages.find]
include = ["bip322audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
