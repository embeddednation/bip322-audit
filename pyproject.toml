[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-audit"
version = "0.10.5"
description = "Proof of control of a wallet's coins at a block: BIP-322 proofs per funded address plus the on-chain checks an auditor runs on their own node"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# Until the packages are on PyPI, dependencies are direct git references at pinned tags, so that
# `pip install "bip322-audit @ git+ssh://git@github.com/embeddednation/bip322-audit.git@v0.7.0"` brings the core along.
dependencies = [
    "bip322-core @ git+ssh://git@github.com/embeddednation/bip322-core.git@v0.9.2",
]

[project.optional-dependencies]
kernel = ["bip322-core[kernel] @ git+ssh://git@github.com/embeddednation/bip322-core.git@v0.9.2"]
dev = ["pytest>=8"]

[project.scripts]
bip322-audit = "bip322audit.cli:main"

[tool.setuptools.packages.find]
include = ["bip322audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
