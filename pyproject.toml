[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bip322-audit"
version = "0.12.1"
description = "Proof of control of a wallet's coins at a block: BIP-322 proofs per funded address plus the on-chain checks an auditor runs on their own node"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Embedded Nation AB" }]
keywords = ["bitcoin", "bip322", "proof of control", "audit", "multisig", "psbt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "bip322-core>=0.11.1,<0.12",
]

[project.urls]
Homepage = "https://github.com/embeddednation/bip322-audit"
Changelog = "https://github.com/embeddednation/bip322-audit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
kernel = ["bip322-core[kernel]>=0.11.1,<0.12"]
dev = ["pytest>=8"]

[project.scripts]
bip322-audit = "bip322audit.cli:main"

[tool.setuptools.packages.find]
include = ["bip322audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501"]
